<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kokkai — Estado de tu obra</title>
<meta name="robots" content="noindex, nofollow">
<style>
  :root {
    --paper: #f4f1ea; --panel: #ffffff; --line: #e4ddc9;
    --ink: #1a1a1a; --gold: #B9943E; --dim: #8a8a8a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: Arial, Helvetica, sans-serif;
    background: var(--paper); color: var(--ink);
  }
  .top {
    background: #1a1a1a; padding: 22px 20px; text-align: center;
  }
  .top .logo { font-size: 22px; letter-spacing: 3px; color: #fff; font-weight: 700; }
  .top .logo span { color: var(--gold); }
  .wrap { max-width: 560px; margin: 0 auto; padding: 20px 16px 60px; }
  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 22px 20px; margin-bottom: 16px;
  }
  .cliente-nombre { font-size: 20px; font-weight: 700; margin: 0 0 2px; }
  .obra-sub { color: var(--dim); font-size: 13px; margin-bottom: 18px; }
  .estado-badge {
    display: inline-block; background: #faf6ec; border: 1px solid var(--gold);
    color: #8a6d1f; font-weight: 700; font-size: 13px; padding: 6px 14px;
    border-radius: 20px; margin-bottom: 12px;
  }
  .estado-desc { font-size: 15px; line-height: 1.6; margin-bottom: 6px; }
  .proximo-paso {
    margin-top: 14px; padding: 12px 14px; background: #faf6ec; border-radius: 8px;
    font-size: 13.5px; line-height: 1.5;
  }
  .proximo-paso b { color: var(--gold); text-transform: uppercase; font-size: 10.5px; letter-spacing: .5px; display: block; margin-bottom: 4px; }
  .fecha-box {
    display: flex; align-items: center; gap: 10px; margin-top: 14px;
    padding: 12px 14px; border: 1px dashed var(--line); border-radius: 8px;
  }
  .fecha-box .num { font-size: 22px; }
  .fecha-box .txt { font-size: 13px; color: #555; }
  .fecha-box .aprox { font-size: 11px; color: var(--dim); font-style: italic; }
  .section-title {
    font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--dim);
    margin: 0 0 12px; font-weight: 700;
  }
  .fotos-grid {
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px;
  }
  .fotos-grid img {
    width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 8px;
    background: #eee; cursor: pointer;
  }
  .contacto { font-size: 13.5px; line-height: 1.7; color: #444; }
  .contacto a { color: var(--gold); text-decoration: none; font-weight: 700; }
  .footer-note { text-align: center; font-size: 11px; color: var(--dim); margin-top: 18px; }
  .loading, .error { text-align: center; padding: 60px 20px; color: var(--dim); }
  .error { color: #b3261e; }
  .lightbox {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,.9);
    align-items: center; justify-content: center; z-index: 999; padding: 20px;
  }
  .lightbox.open { display: flex; }
  .lightbox img { max-width: 100%; max-height: 100%; border-radius: 8px; }
</style>
</head>
<body>
  <div class="top"><div class="logo">KOK<span>KAI</span></div></div>
  <div class="wrap" id="app">
    <div class="loading">Cargando el estado de tu obra…</div>
  </div>
  <div class="lightbox" id="lightbox" onclick="this.classList.remove('open')">
    <img id="lightboxImg" src="">
  </div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbymOId6j3brNzKsSbfR7MYJ_UIa3yOvwX6q_N60UprTUf8cZqfYy2XVnoRiZlrV0vB4PQ/exec';

function escHtml(s) {
  return String(s === undefined || s === null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function formatFechaLarga(iso) {
  if (!iso) return '';
  const meses = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  const d = new Date(iso + 'T00:00:00');
  if (isNaN(d.getTime())) return iso;
  return d.getDate() + ' de ' + meses[d.getMonth()] + ' de ' + d.getFullYear();
}

async function cargar() {
  const params = new URLSearchParams(window.location.search);
  const token = params.get('t');
  const app = document.getElementById('app');
  if (!token) {
    app.innerHTML = '<div class="error">Este link está incompleto. Pedile a Kokkai que te reenvíe el link correcto.</div>';
    return;
  }
  try {
    const res = await fetch(API_URL + '?action=clientePortalVer&t=' + encodeURIComponent(token));
    const data = await res.json();
    if (!data.ok) {
      app.innerHTML = '<div class="error">' + escHtml(data.error || 'No pudimos cargar tu obra.') + '</div>';
      return;
    }
    render(data);
  } catch (e) {
    app.innerHTML = '<div class="error">No pudimos conectar. Probá de nuevo en un rato, o contactanos.</div>';
  }
}

function render(d) {
  const app = document.getElementById('app');
  let fotosHtml = '';
  if (d.fotos && d.fotos.length) {
    fotosHtml = '<div class="card"><div class="section-title">Avance de la obra</div><div class="fotos-grid">' +
      d.fotos.map(function(f) {
        return '<img src="' + f.url + '" alt="Foto de avance" onclick="abrirFoto(\'' + f.url + '\')" loading="lazy">';
      }).join('') + '</div></div>';
  }

  let fechaHtml = '';
  if (d.fechaEstimada) {
    fechaHtml = '<div class="fecha-box">' +
      '<div>📅</div>' +
      '<div><div class="txt">Fecha estimada de instalación</div>' +
      '<div class="num">' + escHtml(formatFechaLarga(d.fechaEstimada)) + '</div>' +
      (d.fechaAproximada ? '<div class="aprox">Todavía no está 100% confirmada, puede moverse.</div>' : '') +
      '</div></div>';
  }

  app.innerHTML =
    '<div class="card">' +
      '<div class="cliente-nombre">' + escHtml(d.cliente) + '</div>' +
      '<div class="obra-sub">' + (d.codigo ? escHtml(d.codigo) : '') + (d.direccion ? ' · ' + escHtml(d.direccion) : '') + '</div>' +
      '<div class="estado-badge">' + escHtml(d.estadoLabel) + '</div>' +
      '<div class="estado-desc">' + escHtml(d.estadoDescripcion) + '</div>' +
      fechaHtml +
      (d.proximoPaso ? '<div class="proximo-paso"><b>Próximo paso</b>' + escHtml(d.proximoPaso) + '</div>' : '') +
    '</div>' +
    fotosHtml +
    '<div class="card">' +
      '<div class="section-title">¿Alguna duda?</div>' +
      '<div class="contacto">' +
        (d.contactoEmail ? 'Escribinos a <a href="mailto:' + escHtml(d.contactoEmail) + '">' + escHtml(d.contactoEmail) + '</a><br>' : '') +
        (d.contactoTel ? 'o llamanos al <a href="tel:' + escHtml(d.contactoTel) + '">' + escHtml(d.contactoTel) + '</a>' : '') +
      '</div>' +
    '</div>' +
    '<div class="footer-note">Esta página se actualiza sola — podés volver a abrir este link cuando quieras.</div>';
}

function abrirFoto(url) {
  document.getElementById('lightboxImg').src = url;
  document.getElementById('lightbox').classList.add('open');
}

cargar();
</script>
</body>
</html>
